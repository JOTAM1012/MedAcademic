<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MedAcademic - Gestão de Estudos Médicos</title>
    <meta name="google-site-verification" content="Cfdo55P44CbhBZLAfOUYb4vy8lAGDkXSoFGhXcvt6W4" />
    <meta name="description" content="Sistema completo para estudantes de medicina com semestres, repetição espaçada, cronômetro Pomodoro, gestão de notas e funcionamento 100% offline." />
    <meta name="theme-color" content="#0f172a" />
    <script>
      // aplica o tema antes de desenhar a página (escuro é o padrão)
      try {
        var t = localStorage.getItem('medacademic_theme') === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedAcademic" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:title" content="MedAcademic - Gestão de Estudos Médicos" />
    <meta property="og:description" content="Plataforma de alta produtividade para estudantes de medicina e residentes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
