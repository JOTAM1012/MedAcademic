<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#17233d" />
      <stop offset="0.55" stop-color="#0b1222" />
      <stop offset="1" stop-color="#04070d" />
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2b47" />
      <stop offset="1" stop-color="#0c1424" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="steth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc" />
      <stop offset="0.5" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" />
    </filter>
  </defs>

  <!-- fundo escuro (quadrado inteiro: Android e iOS aplicam a própria máscara) -->
  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- placa elevada (efeito 3D) -->
  <g filter="url(#drop)">
    <rect x="227" y="227" width="570" height="570" rx="156" fill="url(#tile)" />
  </g>
  <rect x="227" y="227" width="570" height="570" rx="156" fill="url(#sheen)" />
  <rect x="228.5" y="228.5" width="567" height="567" rx="154.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3" />
  <rect x="227" y="227" width="570" height="570" rx="156" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2" />

  <!-- estetoscópio (traço com brilho suave) -->
  <g transform="translate(512 520) scale(14.5) translate(-12 -11.5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2.6" filter="url(#glow)">
      <path d="M11 2v2" />
      <path d="M5 2v2" />
      <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
      <path d="M8 15a6 6 0 0 0 12 0v-3" />
      <circle cx="20" cy="10" r="2" />
    </g>
    <g stroke="url(#steth)" stroke-width="1.7">
      <path d="M11 2v2" />
      <path d="M5 2v2" />
      <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
      <path d="M8 15a6 6 0 0 0 12 0v-3" />
      <circle cx="20" cy="10" r="2" />
    </g>
  </g>
</svg>
